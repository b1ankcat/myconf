# ==============================================================================
# 1. 核心通用设置 (最低兼容 Tmux 2.6，即 Rocky/RHEL 8 自带的 2.7；新版本特性用 -q 静默降级)
# ==============================================================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 10ms 兼顾 Vim 零延迟手感与高延迟 SSH 下转义序列的完整性
set -sg escape-time 10
set -g history-limit 100000
set -g mouse off
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
setw -g mode-keys vi
setw -g aggressive-resize on

# 关闭最后一个窗口时自动切换到其他活跃会话，而非直接退出 Tmux
set -g detach-on-destroy off

# 提示信息停留 1.5 秒 (默认 750ms 一闪而过)；终端标题显示 会话:窗口
set -g display-time 1500
set -g set-titles on
set -g set-titles-string "#S:#W"

# ==============================================================================
# 2. 终端颜色与真彩支持 (自适应 Terminfo 降级)
# ==============================================================================
set -g default-terminal "screen-256color"
if-shell "infocmp tmux-256color >/dev/null 2>&1" "set -g default-terminal 'tmux-256color'"

# 先复位再追加，避免每次 Prefix + r 重载时 -a 让条目无限叠加
set -su terminal-overrides

# 外层终端 TrueColor：macOS 14 及更早的 Terminal.app 不支持 24 位色，强开会花屏
if-shell '[ "$TERM_PROGRAM" != "Apple_Terminal" ]' \
  "set -as terminal-overrides ',*256col*:Tc,xterm*:Tc,tmux*:Tc,alacritty*:Tc,*kitty*:Tc,wezterm*:Tc,ghostty*:Tc,foot*:Tc'"

# OSC 52 剪贴板透传：Ms 的 %p1 是选区类型、%p2 才是 base64 内容
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

# Tmux 3.2+：把 C-S-x、C-Enter 等扩展组合键传给 Vim 等程序 (旧版本无此选项，-q 静默跳过)
set -sq extended-keys on
set -suq terminal-features
set -asq terminal-features ',xterm*:extkeys'

# ==============================================================================
# 3. 快捷键绑定 - 窗格与窗口管理
# ==============================================================================
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# 快速重载配置 (Prefix + r)，与 Tmux 自身的配置文件查找顺序一致
bind r run-shell ' \
  for f in "$HOME/.tmux.conf" "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf"; do \
    if [ -f "$f" ]; then tmux source-file "$f" && tmux display-message "Config reloaded: $f"; exit 0; fi; \
  done; \
  tmux display-message "No tmux.conf found"'

# 快速切换鼠标模式 (Prefix + m)，方便临时滚屏
bind m set -g mouse \; display-message "Mouse: #{?mouse,ON,OFF}"

# 使用 Vim 经典的 hjkl 键在窗格间流畅切换
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 使用 HJKL 微调窗格大小 (支持连续按键)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 无前缀 Ctrl-h/j/k/l 在 Vim 窗口与 Tmux 窗格间无缝切换 (与 .vimrc 中的 s:Navigate 配合，替代 vim-tmux-navigator)
# 当前 pane 运行 Vim 时把按键交给 Vim，由 Vim 在到达边缘时再调用 tmux select-pane
bind -n C-h if-shell 'case "#{pane_current_command}" in *vim*|view) exit 0;; esac; exit 1' 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell 'case "#{pane_current_command}" in *vim*|view) exit 0;; esac; exit 1' 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell 'case "#{pane_current_command}" in *vim*|view) exit 0;; esac; exit 1' 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell 'case "#{pane_current_command}" in *vim*|view) exit 0;; esac; exit 1' 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# 被占用的 Shell 快捷键改由 Prefix 发送：Prefix + C-l 清屏，Prefix + C-k 删除到行尾
bind C-l send-keys C-l
bind C-k send-keys C-k

# 窗口操作：Tab 回到上一个窗口，< > 左右移动当前窗口，x 直接关闭窗格 (不再确认)，P 从复制历史选择粘贴
# swap-window 是否跟随焦点在 2.x 与 3.x 间相反，这里按 window_id 显式选回被移动的窗口
# (session_id 形如 $0，必须运行时取到变量里，直接展开进双引号会被 shell 当成变量)
bind Tab last-window
bind -r < run-shell 'w="#{window_id}"; s=$(tmux display-message -p -t "$w" "##{session_id}"); tmux swap-window -s "$w" -t "$s:-1" \; select-window -t "$w"'
bind -r > run-shell 'w="#{window_id}"; s=$(tmux display-message -p -t "$w" "##{session_id}"); tmux swap-window -s "$w" -t "$s:+1" \; select-window -t "$w"'
bind x kill-pane
bind P choose-buffer

# ==============================================================================
# 4. 原生实现 tmux-yank (支持本地剪贴板 + SSH 远程 OSC 52 穿透)
# ==============================================================================
# set-clipboard on：所有复制 (含 copy-pipe) 都会通过 OSC 52 发给外层终端，
# 同时允许 Vim 等程序发出的 OSC 52 经 Tmux 转发，因此下方命令无需再手动兜底 OSC 52
set -s set-clipboard on

# 依次尝试 pbcopy / wl-copy / xclip / xsel / clip.exe；数据直接走 stdin，不经变量以免丢失末尾换行
set -g @native_yank_cmd ' \
  if command -v pbcopy >/dev/null 2>&1; then \
    exec pbcopy; \
  elif [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then \
    exec wl-copy; \
  elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1; then \
    exec xclip -in -selection clipboard >/dev/null 2>&1; \
  elif [ -n "$DISPLAY" ] && command -v xsel >/dev/null 2>&1; then \
    exec xsel -ib; \
  elif command -v clip.exe >/dev/null 2>&1; then \
    if command -v iconv >/dev/null 2>&1; then iconv -f UTF-8 -t UTF-16LE | clip.exe; else exec clip.exe; fi; \
  else \
    cat >/dev/null; \
  fi'

# Tmux 2.4+ 标准 copy-mode-vi 绑定 (Enter 与鼠标拖选也走同一条复制命令)
# 复制命令在运行时用 tmux show 取出，不依赖各版本 copy-pipe 对 #{...} 的展开行为差异
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle \; send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'sh -c "$(tmux show -gv @native_yank_cmd)"'
bind -T copy-mode-vi Y send-keys -X select-line \; send-keys -X copy-pipe-and-cancel 'sh -c "$(tmux show -gv @native_yank_cmd)"'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'sh -c "$(tmux show -gv @native_yank_cmd)"'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'sh -c "$(tmux show -gv @native_yank_cmd)"'
# Esc：有选区时取消选区，否则退出复制模式
bind -T copy-mode-vi Escape if-shell -F '#{selection_present}' 'send-keys -X clear-selection' 'send-keys -X cancel'

# ==============================================================================
# 5. 高颜值原生状态栏 (Catppuccin Mocha)
# ==============================================================================
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-interval 5

# 开启了 detach-on-destroy off，多会话间切换时需要能看到当前会话名
set -g status-left-length 32
set -g status-left "#[fg=#1e1e2e,bg=#a6e3a1,bold] #S #[default] "
set -g status-right-length 120
# 按下 Prefix 时显示 PREFIX，窗格被 Prefix + z 放大时显示 ZOOM
set -g status-right "#{?client_prefix,#[reverse] PREFIX #[noreverse] ,}#{?window_zoomed_flag,#[fg=#f38ba8]ZOOM ,}#[fg=#89b4fa] #H │ [c]rt, [n]xt, [r]ld, [m]os, [C-s]ave, [C-r]estore #[fg=#6c7086]"

setw -g window-status-format "#[fg=#6c7086,bg=#313244]#I #[fg=#cdd6f4,bg=#313244] #W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold]#I #[fg=#cdd6f4,bg=#45475a,bold] #W "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "fg=#1e1e2e,bg=#f9e2af,bold"

# ==============================================================================
# 6. 原生实现 tmux-resurrect & tmux-continuum (零插件纯内置引擎)
# ==============================================================================
# 机制说明：
# - 整个引擎是存放在 @native_session 中的一段 POSIX sh 脚本，通过
#   sh -c "$(tmux show -gv @native_session)" sh <save|restore|boot> 调用；
#   脚本内容不经过 Tmux 的格式展开与二次引号解析，可直接使用 #{...}
# - 状态保存在 ~/.tmux/resurrect_native/ (权限 700/600，pane 内容可能含敏感信息)
# - 所有读写都持有 mkdir 互斥锁；锁被占用时 save 只标记 .dirty，由持锁者完成后补存一次，
#   因此 kill 多窗口会话时触发的多个 window-unlinked 钩子不会并发踩踏
# - state.tmp / panes.tmp 写完后再整体替换 state.last / panes，中途失败不会破坏上次的存档
# - 恢复时绝不 respawn 已存在的 pane (避免杀掉正在运行的程序)，仅冷启动时替换初始的空 shell
# - 15 分钟定时保存以脱离 Tmux 的独立后台进程运行，并以 server pid 判断存活：
#   Tmux 2.x 在退出前会等待所有 run-shell 任务结束，若用常驻 run-shell 循环，kill-server 后
#   服务器会半死不活地挂住最长 15 分钟，期间所有 tmux 命令都报 "lost server"

set -g @native_session ' \
  umask 077; \
  T=$(printf "\t"); \
  dir="$HOME/.tmux/resurrect_native"; \
  lock="$dir/.lock"; \
  mkdir -p "$dir" || exit 1; \
  acquire() { \
    if mkdir "$lock" 2>/dev/null; then echo $$ > "$lock/pid"; return 0; fi; \
    pid=$(cat "$lock/pid" 2>/dev/null); \
    if [ -n "$pid" ]; then kill -0 "$pid" 2>/dev/null && return 1; \
    elif [ -z "$(find "$lock" -maxdepth 0 -mmin +1 2>/dev/null)" ]; then return 1; fi; \
    rm -rf "$lock"; \
    mkdir "$lock" 2>/dev/null && echo $$ > "$lock/pid"; \
  }; \
  release() { \
    [ "$(cat "$lock/pid" 2>/dev/null)" = "$$" ] && rm -rf "$lock"; \
    return 0; \
  }; \
  trap "release; exit 1" INT TERM HUP; \
  save_once() { \
    rm -rf "$dir/state.tmp" "$dir/panes.tmp"; \
    mkdir "$dir/panes.tmp" || return 1; \
    tmux list-panes -a -F "#{session_name}${T}#{window_index}${T}#{window_name}:${T}#{window_active}${T}#{window_layout}${T}#{pane_index}${T}#{pane_active}${T}#{pane_current_path}:${T}#{pane_id}" > "$dir/state.tmp" 2>/dev/null; \
    if [ ! -s "$dir/state.tmp" ]; then rm -rf "$dir/state.tmp" "$dir/panes.tmp"; return 0; fi; \
    while IFS="$T" read -r s w wn wa wl p pa pp pid; do \
      f="$dir/panes.tmp/${pid#%}.txt"; \
      tmux capture-pane -epJ -t "$pid" -S -500 > "$f" 2>/dev/null || \
      tmux capture-pane -p -t "$pid" > "$f" 2>/dev/null; \
    done < "$dir/state.tmp"; \
    rm -rf "$dir/panes.old"; \
    [ -d "$dir/panes" ] && mv "$dir/panes" "$dir/panes.old"; \
    mv "$dir/panes.tmp" "$dir/panes" && mv -f "$dir/state.tmp" "$dir/state.last"; \
    rm -rf "$dir/panes.old"; \
    date +%s > "$dir/last_save_ts"; \
  }; \
  save_loop() { \
    while :; do \
      rm -f "$dir/.dirty"; \
      save_once; \
      [ -e "$dir/.dirty" ] || break; \
    done; \
  }; \
  restore() { \
    [ -s "$dir/state.last" ] || return 0; \
    mode="$1"; \
    rdir="$dir/restore"; \
    rm -rf "$rdir"; \
    cp -R "$dir/panes" "$rdir" 2>/dev/null || mkdir -p "$rdir"; \
    boot_s=""; boot_w=""; \
    if [ "$mode" = boot ]; then \
      boot_s=$(tmux list-sessions -F "#{session_name}" 2>/dev/null | head -n 1); \
      boot_w=$(tmux list-windows -t "=$boot_s" -F "#{window_index}" 2>/dev/null | head -n 1); \
    fi; \
    touched="|"; first_s=""; \
    while IFS="$T" read -r s w wn wa wl p pa pp pid; do \
      wn=${wn%:}; pp=${pp%:}; \
      [ -d "$pp" ] || pp="$HOME"; \
      [ -n "$first_s" ] || first_s="$s"; \
      pf="$rdir/${pid#%}.txt"; \
      cmd="[ -s \"$pf\" ] && cat \"$pf\"; rm -f \"$pf\"; exec \"\${SHELL:-/bin/sh}\" -l"; \
      key="$s:$w"; \
      if ! tmux has-session -t "=$s" 2>/dev/null; then \
        tmux new-session -d -s "$s" -n "$wn" -c "$pp" "$cmd" || continue; \
        cur=$(tmux list-windows -t "=$s" -F "#{window_index}" | head -n 1); \
        [ "$cur" = "$w" ] || tmux move-window -s "=$s:$cur" -t "=$s:$w" 2>/dev/null; \
        touched="$touched$key|"; \
      elif ! tmux list-windows -t "=$s" -F "#{window_index}" | grep -qx "$w"; then \
        tmux new-window -d -t "=$s:$w" -n "$wn" -c "$pp" "$cmd" && touched="$touched$key|"; \
      else \
        case "$touched" in \
          *"|$key|"*) \
            tmux split-window -d -t "=$key" -c "$pp" "$cmd" 2>/dev/null || \
            { tmux select-layout -t "=$key" tiled; tmux split-window -d -t "=$key" -c "$pp" "$cmd"; } ;; \
          *) \
            if [ "$mode" = boot ] && [ "$s" = "$boot_s" ] && [ "$w" = "$boot_w" ]; then \
              tmux respawn-pane -k -t "=$key" -c "$pp" "$cmd" && touched="$touched$key|"; \
            fi ;; \
        esac; \
      fi; \
    done < "$dir/state.last"; \
    while IFS="$T" read -r s w wn wa wl p pa pp pid; do \
      key="$s:$w"; \
      case "$touched" in *"|$key|"*) ;; *) continue ;; esac; \
      tmux rename-window -t "=$key" "${wn%:}" 2>/dev/null; \
      tmux select-layout -t "=$key" "$wl" 2>/dev/null; \
      [ "$pa" = "1" ] && tmux select-pane -t "=$key.$p" 2>/dev/null; \
      [ "$wa" = "1" ] && tmux select-window -t "=$key" 2>/dev/null; \
    done < "$dir/state.last"; \
    if [ "$mode" = boot ] && [ -n "$boot_s" ]; then \
      if ! awk -F "$T" -v s="$boot_s" "\$1 == s { found = 1 } END { exit !found }" "$dir/state.last"; then \
        [ -n "$first_s" ] && tmux switch-client -t "=$first_s" 2>/dev/null; \
        tmux kill-session -t "=$boot_s" 2>/dev/null; \
      else \
        case "$touched" in *"|$boot_s:$boot_w|"*) ;; *) tmux kill-window -t "=$boot_s:$boot_w" 2>/dev/null ;; esac; \
      fi; \
    fi; \
  }; \
  wait_lock() { \
    i=0; \
    until acquire; do i=$((i + 1)); [ "$i" -gt 100 ] && return 1; sleep 0.1; done; \
  }; \
  case "$1" in \
    save) \
      if acquire; then save_loop; release; else : > "$dir/.dirty"; fi ;; \
    restore) \
      wait_lock || exit 1; restore manual; sleep 1; save_loop; release ;; \
    boot) \
      [ "$(tmux show -gv @native_initialized 2>/dev/null)" = "1" ] && exit 0; \
      tmux set -g @native_initialized 1; \
      sleep 0.5; \
      if [ "$(tmux list-panes -a 2>/dev/null | wc -l | tr -d " ")" = "1" ]; then \
        if wait_lock; then restore boot; sleep 1; save_loop; release; fi; \
      fi; \
      spid=$(tmux display-message -p "#{pid}" 2>/dev/null); \
      [ -n "$spid" ] || exit 0; \
      sh -c "$(tmux show -gv @native_session)" sh loop "$spid" </dev/null >/dev/null 2>&1 & ;; \
    loop) \
      n=0; \
      while sleep 60 && kill -0 "$2" 2>/dev/null; do \
        n=$((n + 1)); [ "$n" -lt 15 ] && continue; n=0; \
        if acquire; then save_loop; release; else : > "$dir/.dirty"; fi; \
      done ;; \
  esac'

set -g @native_save 'sh -c "$(tmux show -gv @native_session)" sh save'
set -g @native_restore 'sh -c "$(tmux show -gv @native_session)" sh restore'

# 手动保存与恢复快捷键 (与 tmux-resurrect 默认键位完全一致)
# Prefix + Ctrl-s : 手动保存当前全部会话
# Prefix + Ctrl-r : 手动恢复上次保存的会话 (已存在的 pane 保持不动)
bind C-s run-shell -b "#{@native_save}" \; display-message "Session state saved!"
bind C-r run-shell -b "#{@native_restore}" \; display-message "Session state restored!"

# 生命周期钩子：每次 Detach (Prefix + d) 或窗口关闭时自动保存一次
set-hook -g client-detached 'run-shell -b "#{@native_save}"'
set-hook -g window-unlinked 'run-shell -b "#{@native_save}"'

# 冷启动自动恢复 + 15 分钟定时后台自动保存 (等效 @continuum-restore 'on')
run-shell -b 'sh -c "$(tmux show -gv @native_session)" sh boot'
