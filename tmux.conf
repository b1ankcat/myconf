# ==============================================================================
# 1. 核心通用设置 (兼顾现代特性与向下兼容)
# ==============================================================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 10ms 兼顾 Vim 零延迟手感与高延迟 SSH 下转义序列的完整性
set -sg escape-time 10
set -g history-limit 100000
set -g mouse off
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
setw -g mode-keys vi
setw -g aggressive-resize on

# 关闭最后一个窗口时自动切换到其他活跃会话，而非直接退出 Tmux
set -g detach-on-destroy off

# ==============================================================================
# 2. 终端颜色与真彩支持 (自适应 Terminfo 降级)
# ==============================================================================
set -g default-terminal "screen-256color"
if-shell "infocmp tmux-256color >/dev/null 2>&1" "set -g default-terminal 'tmux-256color'"

# 兼容 Tmux 1.9 ~ 3.5+ 的 TrueColor (Tc/RGB) 与 OSC 52 剪贴板透传 (Ms)
set -ga terminal-overrides ",*256col*:Tc,xterm*:Tc,tmux*:Tc"
set -ga terminal-overrides ",*:Ms=\\E]52;c;%p1%s\\a"

# ==============================================================================
# 3. 快捷键绑定 - 窗格与窗口管理
# ==============================================================================
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# 快速重载配置 (Prefix + r)
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# 快速切换鼠标模式 (Prefix + m)，方便临时滚屏
bind m set -g mouse \; display-message "Mouse: #{?mouse,ON,OFF}"

# 使用 Vim 经典的 hjkl 键在窗格间流畅切换
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 使用 HJKL 微调窗格大小 (支持连续按键)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ==============================================================================
# 4. 原生实现 tmux-yank (支持本地剪贴板 + SSH 远程 OSC 52 穿透)
# ==============================================================================
set -s set-clipboard on

# 提取通用复制命令：依次尝试 pbcopy / wl-copy / xclip / xsel / clip.exe，最后回退到原生 OSC 52
set -g @native_yank_cmd ' \
  buf=$(cat); \
  if command -v pbcopy >/dev/null 2>&1; then \
    printf "%s" "$buf" | pbcopy; \
  elif command -v wl-copy >/dev/null 2>&1 && [ -n "$WAYLAND_DISPLAY" ]; then \
    printf "%s" "$buf" | wl-copy; \
  elif command -v xclip >/dev/null 2>&1 && [ -n "$DISPLAY" ]; then \
    printf "%s" "$buf" | xclip -in -selection clipboard; \
  elif command -v xsel >/dev/null 2>&1 && [ -n "$DISPLAY" ]; then \
    printf "%s" "$buf" | xsel -ib; \
  elif command -v clip.exe >/dev/null 2>&1; then \
    printf "%s" "$buf" | clip.exe; \
  else \
    printf "%s" "$buf" | tmux load-buffer -w - 2>/dev/null || { \
      b64=$(printf "%s" "$buf" | base64 | tr -d "\r\n"); \
      tty=$(tmux display-message -p "#{client_tty}"); \
      [ -w "$tty" ] && printf "\033]52;c;%s\a" "$b64" > "$tty"; \
    }; \
  fi \
'

# Tmux 2.4+ 标准 copy-mode-vi 绑定
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle \; send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@native_yank_cmd}"
bind -T copy-mode-vi Y send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "#{@native_yank_cmd}"

# ==============================================================================
# 5. 高颜值原生状态栏 (Catppuccin Mocha)
# ==============================================================================
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-interval 5

set -g status-left-length 0
set -g status-right-length 120
set -g status-right "#[fg=#89b4fa] #H │ [c]rt, [n]xt, [r]ld, [m]os, [C-s]ave, [C-r]estore #[fg=#6c7086]"

setw -g window-status-format "#[fg=#6c7086,bg=#313244]#I #[fg=#cdd6f4,bg=#313244] #W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold]#I #[fg=#cdd6f4,bg=#45475a,bold] #W "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "fg=#1e1e2e,bg=#f9e2af,bold"

# ==============================================================================
# 6. 原生实现 tmux-resurrect & tmux-continuum (零插件纯内置引擎)
# ==============================================================================
# 机制说明：
# - 使用 H=$(printf "\043") 动态生成 '#'，规避不同版本 Tmux 对 run-shell 内 #{...} 的提前展开差异
# - 状态文件保存在 ~/.tmux/resurrect_native/ 下，采用 .tmp -> .last 原子替换防损坏

set -g @resurrect_save ' \
  H=$(printf "\043"); T=$(printf "\t"); \
  dir="$HOME/.tmux/resurrect_native"; \
  mkdir -p "$dir/panes"; \
  rm -f "$dir/state.tmp"; \
  tmux list-panes -a -F "${H}{session_name}${T}${H}{window_index}${T}${H}{window_name}:${T}${H}{window_active}${T}${H}{window_layout}${T}${H}{pane_index}${T}${H}{pane_active}${T}${H}{pane_current_path}:${T}${H}{pane_id}" > "$dir/state.tmp" 2>/dev/null; \
  if [ -s "$dir/state.tmp" ]; then \
    rm -f "$dir/panes/"*.txt; \
    while IFS="$T" read -r s w wn wa wl p pa pp pid; do \
      tmux capture-pane -epJ -t "$pid" -S -500 > "$dir/panes/${s}_${w}_${p}.txt" 2>/dev/null || \
      tmux capture-pane -p -t "$pid" > "$dir/panes/${s}_${w}_${p}.txt" 2>/dev/null; \
    done < "$dir/state.tmp"; \
    mv -f "$dir/state.tmp" "$dir/state.last"; \
    date +%s > "$dir/last_save_ts"; \
  fi \
'

set -g @resurrect_restore ' \
  H=$(printf "\043"); T=$(printf "\t"); \
  dir="$HOME/.tmux/resurrect_native"; \
  [ -s "$dir/state.last" ] || exit 0; \
  boot_s=$(tmux display-message -p "${H}{session_name}" 2>/dev/null); \
  first_s=""; \
  while IFS="$T" read -r s w wn wa wl p pa pp pid; do \
    wn=${wn%:}; pp=${pp%:}; \
    [ -d "$pp" ] || pp="$HOME"; \
    [ -z "$first_s" ] && first_s="$s"; \
    pf="$dir/panes/${s}_${w}_${p}.txt"; \
    cmd="if [ -s \"$pf\" ]; then cat \"$pf\"; fi; exec \"${SHELL:-/bin/sh}\" -l"; \
    if ! tmux has-session -t "$s" 2>/dev/null; then \
      tmux new-session -d -s "$s" -n "$wn" -c "$pp" "$cmd"; \
      cur_w=$(tmux list-windows -t "$s" -F "${H}{window_index}" | head -n 1); \
      [ "$cur_w" != "$w" ] && tmux move-window -s "$s:$cur_w" -t "$s:$w" 2>/dev/null; \
    elif ! tmux list-windows -t "$s" -F "${H}{window_index}" | grep -qx "$w"; then \
      tmux new-window -d -t "$s:$w" -n "$wn" -c "$pp" "$cmd"; \
    else \
      if tmux list-panes -t "$s:$w" -F "${H}{pane_index}" 2>/dev/null | grep -qx "$p"; then \
        tmux respawn-pane -k -t "$s:$w.$p" -c "$pp" "$cmd" 2>/dev/null; \
      else \
        tmux select-layout -t "$s:$w" tiled 2>/dev/null; \
        tmux split-window -d -t "$s:$w" -c "$pp" "$cmd"; \
      fi; \
    fi; \
  done < "$dir/state.last"; \
  while IFS="$T" read -r s w wn wa wl p pa pp pid; do \
    wn=${wn%:}; \
    tmux rename-window -t "$s:$w" "$wn" 2>/dev/null; \
    tmux select-layout -t "$s:$w" "$wl" 2>/dev/null; \
    [ "$pa" = "1" ] && tmux select-pane -t "$s:$w.$p" 2>/dev/null; \
    [ "$wa" = "1" ] && tmux select-window -t "$s:$w" 2>/dev/null; \
  done < "$dir/state.last"; \
  if [ -n "$first_s" ] && [ -n "$boot_s" ] && ! grep -q "^${boot_s}${T}" "$dir/state.last"; then \
    tmux switch-client -t "$first_s" 2>/dev/null; \
    tmux kill-session -t "$boot_s" 2>/dev/null; \
  fi \
'

# 手动保存与恢复快捷键 (与 tmux-resurrect 默认键位完全一致)
# Prefix + Ctrl-s : 手动保存当前全部会话
# Prefix + Ctrl-r : 手动恢复上次保存的会话
bind C-s run-shell -b "#{@resurrect_save}" \; display-message "Session state saved!"
bind C-r run-shell -b "#{@resurrect_restore}" \; display-message "Session state restored!"

# 生命周期钩子：每次 Detach (Prefix + d) 或窗口关闭时自动保存一次
set-hook -g client-detached 'run-shell -b "#{@resurrect_save}"'
set-hook -g window-unlinked 'run-shell -b "#{@resurrect_save}"'

# 冷启动自动恢复 + 15 分钟定时后台自动保存 (等效 @continuum-restore 'on')
run-shell -b ' \
  if [ "$(tmux show-option -gv @native_initialized 2>/dev/null)" != "1" ]; then \
    tmux set-option -g @native_initialized 1; \
    sleep 0.2; \
    if [ "$(tmux list-panes -a 2>/dev/null | wc -l | tr -d " ")" = "1" ]; then \
      tmux run-shell "#{@resurrect_restore}"; \
    fi; \
    while tmux list-sessions >/dev/null 2>&1; do \
      sleep 900; \
      tmux run-shell "#{@resurrect_save}"; \
    done; \
  fi \
'